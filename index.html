<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM DKI JAKARTA | Linktree</title>
    <style>
        /* Desain dasar halaman - Tema Gelap Modern */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }

        /* Desain Logo Tim */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #ffaa00; /* Aksen warna oranye/kuning khas kota */
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.2);
        }

        /* Teks Nama dan Deskripsi */
        .name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }
        .bio {
            font-size: 15px;
            color: #b3b3b3;
            margin-bottom: 40px;
            text-align: center;
            max-width: 450px;
            line-height: 1.6;
        }

        /* Wadah untuk tombol-tombol */
        .link-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Desain Tombol Link */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid #333;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* Efek saat tombol disentuh/di-hover */
        .link-btn:hover {
            background-color: #ffaa00; /* Berubah jadi oranye saat disentuh */
            color: #121212; /* Teks jadi gelap */
            border-color: #ffaa00;
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(255, 170, 0, 0.3);
        }
    </style>
</head>
<body>

    <img src="https://via.placeholder.com/150/1e1e1e/ffaa00?text=DKI" alt="Logo Team DKI Jakarta" class="profile-pic">

    <div class="name">TEAM DKI JAKARTA</div>
    <div class="bio">Portal Resmi Informasi & Komunitas Team DKI Jakarta. Mari Maju Bersama! 🏙️</div>

    <div class="link-container">
        <a href="#" class="link-btn">📝 Formulir Pendaftaran Anggota</a>
        <a href="#" class="link-btn">📢 Grup WhatsApp / Telegram Resmi</a>
        <a href="#" class="link-btn">📸 Instagram Team DKI Jakarta</a>
        <a href="#" class="link-btn">🗓️ Jadwal Kegiatan & Event</a>
        <a href="#" class="link-btn">🌐 Hubungi Kordinator Wilayah</a>
    </div>

</body>
</html>
